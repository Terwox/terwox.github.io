name: Update open-source contributions

on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oss-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: Install contribution tracker
        run: go install github.com/mabd-dev/gh-oss-stats/cmd/gh-oss-stats@v0.3.5

      - name: Fetch merged contributions
        env:
          GH_OSS_STATS_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh-oss-stats \
            --user Terwox \
            --output "$RUNNER_TEMP/oss_contributions_raw.json"

          jq '{
            username,
            generatedAt,
            summary: {
              totalProjects: .summary.totalProjects,
              totalPRsMerged: .summary.totalPRsMerged
            },
            contributions: [
              .contributions[] | {
                repo,
                owner,
                repoName,
                description,
                repoURL,
                prsMerged,
                firstContribution,
                lastContribution
              }
            ]
          }' "$RUNNER_TEMP/oss_contributions_raw.json" > "$RUNNER_TEMP/oss_contributions.json"

          if [ -f _data/oss_contributions.json ] && \
             diff -q \
               <(jq -S 'del(.generatedAt)' _data/oss_contributions.json) \
               <(jq -S 'del(.generatedAt)' "$RUNNER_TEMP/oss_contributions.json") \
               >/dev/null; then
            echo "Contribution data is unchanged."
          else
            cp "$RUNNER_TEMP/oss_contributions.json" _data/oss_contributions.json
          fi

      - name: Commit changed contribution data
        run: |
          git add _data/oss_contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh open-source contribution stats"
          git push
